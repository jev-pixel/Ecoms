{% extends 'shop/base.html' %}
{% load static %}

{% block title %}Choose payment — Daboss Fast Food Resto{% endblock %}

{% block content %}
<div class="container" style="max-width:720px;padding-top:var(--space-7);padding-bottom:var(--space-9);">
  <h1 style="font-size:28px;margin-bottom:var(--space-2);">How would you like to pay?</h1>
  <p style="color:var(--color-text-secondary);margin-bottom:var(--space-6);">
    Either way you'll get a QR code receipt — show it at the counter to collect your order.
  </p>

  <form method="POST">
    {% csrf_token %}
    <div class="payment-choice-grid">
      <label class="payment-choice-card">
        <input type="radio" name="payment_type" value="cash" checked>
        <div class="icon-circle accent" style="margin-bottom:var(--space-3);font-size:22px;">&#8369;</div>
        <h3>Cash Payment</h3>
        <p>Pay at the counter when your order is called.</p>
      </label>
      <label class="payment-choice-card">
        <input type="radio" name="payment_type" value="online">
        <div class="icon-circle info" style="margin-bottom:var(--space-3);font-size:22px;">&#128179;</div>
        <h3>Online Payment</h3>
        <p>Pay now with GCash, Maya, or a card.</p>
      </label>
    </div>
    <button type="submit" class="btn btn-primary btn-block" style="margin-top:var(--space-6);">Continue</button>
  </form>
</div>
{% endblock %}
