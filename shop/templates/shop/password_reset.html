{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - NoirBando</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .reset-container {
      max-width: 450px;
      width: 100%;
    }

    .reset-card {
      background: #fff;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }

    .reset-header {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 36px;
      color: #fff;
    }

    .reset-header h2 {
      font-size: 28px;
      font-weight: 700;
      color: #2d3436;
      margin-bottom: 8px;
    }

    .reset-header p {
      font-size: 14px;
      color: #666;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 25px;
    }

    .form-label {
      font-size: 14px;
      font-weight: 600;
      color: #2d3436;
      margin-bottom: 8px;
      display: block;
    }

    .form-control {
      width: 100%;
      padding: 14px 18px 14px 45px;
      border: 2px solid #e9ecef;
      border-radius: 12px;
      font-size: 15px;
      transition: all 0.3s;
      background: #f8f9fa;
    }

    .form-control:focus {
      outline: none;
      border-color: #667eea;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(102,126,234,0.1);
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #999;
      font-size: 18px;
    }

    .btn-reset {
      width: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 5px 15px rgba(102,126,234,0.3);
    }

    .btn-reset:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102,126,234,0.4);
    }

    .back-link {
      text-align: center;
      margin-top: 25px;
    }

    .back-link a {
      color: #667eea;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s;
    }

    .back-link a:hover {
      color: #764ba2;
      gap: 10px;
    }

    .alert {
      padding: 15px 18px;
      border-radius: 12px;
      margin-bottom: 25px;
      font-size: 14px;
      border: none;
    }

    .alert-success {
      background: linear-gradient(135deg, #51cf66 0%, #37b24d 100%);
      color: #fff;
    }

    @media (max-width: 576px) {
      .reset-card {
        padding: 30px 25px;
      }

      .reset-header h2 {
        font-size: 24px;
      }

      .logo-icon {
        width: 70px;
        height: 70px;
        font-size: 32px;
      }
    }
  </style>
</head>
<body>

  <div class="reset-container">
    <div class="reset-card">
      <div class="reset-header">
        <div class="logo-icon">
          <i class="fas fa-key"></i>
        </div>
        <h2>Reset Password</h2>
        <p>Enter your email address and we'll send you a link to reset your password</p>
      </div>

      <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
          <label for="id_email" class="form-label">Email Address</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope input-icon"></i>
            <input 
              type="email" 
              name="email" 
              autofocus 
              required 
              class="form-control" 
              id="id_email"
              placeholder="Enter your email"
            >
          </div>
        </div>
        
        <button type="submit" class="btn-reset">
          <i class="fas fa-paper-plane"></i>
          Send Reset Link
        </button>
      </form>

      <div class="back-link">
        <a href="{% url 'shop:login' %}">
          <i class="fas fa-arrow-left"></i>
          Back to Login
        </a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
