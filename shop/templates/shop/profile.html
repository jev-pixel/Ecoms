{% extends 'shop/base.html' %}
{% load static %}

{% block title %}My Profile — Daboss Motor Shop{% endblock %}

{% block content %}
<div class="container" style="padding-top:var(--space-7);padding-bottom:var(--space-9);max-width:560px;">
  <h1 style="font-size:32px;margin-bottom:var(--space-6);">My profile</h1>

  <div class="panel">
    <form method="POST">
      {% csrf_token %}
      <div class="field-row">
        <div class="field">
          <label for="first_name">First name</label>
          <input type="text" name="first_name" id="first_name" value="{{ user.first_name }}">
        </div>
        <div class="field">
          <label for="last_name">Last name</label>
          <input type="text" name="last_name" id="last_name" value="{{ user.last_name }}">
        </div>
      </div>
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" name="email" id="email" value="{{ user.email }}">
      </div>
      <div class="field">
        <label for="phone_number">Phone number</label>
        <input type="tel" name="phone_number" id="phone_number" value="{{ user.profile.phone_number }}" placeholder="09XX XXX XXXX">
      </div>
      <div class="field">
        <label>Username</label>
        <input type="text" value="{{ user.username }}" disabled style="background:var(--color-surface-muted);color:var(--color-text-secondary);">
      </div>
      <button type="submit" class="btn btn-primary">Save changes</button>
    </form>
  </div>

  <div style="display:flex;gap:var(--space-5);margin-top:var(--space-6);">
    <a href="{% url 'shop:my_orders' %}" class="link-chevron">My orders &rsaquo;</a>
    <a href="{% url 'shop:manage_addresses' %}" class="link-chevron">Manage addresses &rsaquo;</a>
    <a href="{% url 'shop:wishlist' %}" class="link-chevron">Wishlist &rsaquo;</a>
  </div>
</div>
{% endblock %}
